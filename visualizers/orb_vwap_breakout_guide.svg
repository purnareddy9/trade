<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%" style="background-color: #131722; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e222d"/>
      <stop offset="100%" stop-color="#181b24"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Title Banner -->
  <rect x="30" y="20" width="940" height="60" rx="8" fill="#1e222d" stroke="#2a2e39" stroke-width="1.5"/>
  <text x="50" y="58" fill="#2962FF" font-size="22" font-weight="700">15-MINUTE OPENING RANGE BREAKOUT (ORB) + VWAP SETUP</text>

  <!-- Left Main Chart Canvas (620 wide) -->
  <g transform="translate(30, 95)" filter="url(#shadow)">
    <rect width="620" height="555" rx="8" fill="url(#panelGrad)" stroke="#2a2e39" stroke-width="1"/>
    
    <!-- Time axis markers -->
    <line x1="40" y1="460" x2="580" y2="460" stroke="#2a2e39" stroke-width="1"/>
    <text x="140" y="480" fill="#787B86" font-size="12" font-weight="600" text-anchor="middle">09:15 - 09:30 AM</text>
    <text x="140" y="495" fill="#787B86" font-size="11" text-anchor="middle">(Opening Candle)</text>
    
    <text x="320" y="480" fill="#089981" font-size="12" font-weight="700" text-anchor="middle">09:30 - 09:45 AM</text>
    <text x="320" y="495" fill="#089981" font-size="11" text-anchor="middle">(Breakout Candle)</text>

    <text x="480" y="480" fill="#787B86" font-size="12" font-weight="600" text-anchor="middle">09:45 - 10:30 AM</text>
    <text x="480" y="495" fill="#787B86" font-size="11" text-anchor="middle">(Momentum Expansion)</text>

    <!-- Grid lines -->
    <line x1="40" y1="120" x2="580" y2="120" stroke="#1e222d" stroke-width="1"/>
    <line x1="40" y1="200" x2="580" y2="200" stroke="#1e222d" stroke-width="1"/>
    <line x1="40" y1="280" x2="580" y2="280" stroke="#1e222d" stroke-width="1"/>

    <!-- VWAP CURVE (Blue Line) -->
    <path d="M 40 330 Q 140 315 240 295 T 440 250 T 580 210" fill="none" stroke="#2962FF" stroke-width="3"/>
    <text x="50" y="320" fill="#2962FF" font-size="13" font-weight="800">VWAP LINE (Rising Floor)</text>

    <!-- CANDLE 1: 09:15 - 09:30 (Opening Range) -->
    <!-- Wicks -->
    <line x1="140" y1="160" x2="140" y2="340" stroke="#089981" stroke-width="3"/>
    <!-- Body -->
    <rect x="115" y="190" width="50" height="120" fill="#089981" rx="2"/>

    <!-- HIGH OF DAY LINE -->
    <line x1="140" y1="160" x2="580" y2="160" stroke="#089981" stroke-width="2" stroke-dasharray="5,5"/>
    <circle cx="140" cy="160" r="5" fill="#089981"/>
    <rect x="175" y="142" width="160" height="24" rx="4" fill="#089981"/>
    <text x="185" y="158" fill="#FFFFFF" font-size="11" font-weight="700">15-MIN HIGH (₹341.60)</text>

    <!-- LOW OF DAY LINE -->
    <line x1="140" y1="340" x2="350" y2="340" stroke="#F23645" stroke-width="1.5" stroke-dasharray="4,4"/>
    <circle cx="140" cy="340" r="4" fill="#F23645"/>
    <text x="175" y="355" fill="#F23645" font-size="11" font-weight="700">15-MIN LOW (₹334.00)</text>

    <!-- CANDLE 2: 09:30 - 09:45 (The Breakout Candle) -->
    <!-- Wicks -->
    <line x1="320" y1="100" x2="320" y2="240" stroke="#089981" stroke-width="3"/>
    <!-- Body Slices above high -->
    <rect x="295" y="120" width="50" height="100" fill="#089981" rx="2"/>

    <!-- BUY TRIGGER ARROW & BADGE -->
    <circle cx="320" cy="155" r="7" fill="#FFEB3B"/>
    <line x1="320" y1="155" x2="390" y2="135" stroke="#FFEB3B" stroke-width="2"/>
    <rect x="390" y="120" width="180" height="32" rx="4" fill="#131722" stroke="#FFEB3B" stroke-width="1.5"/>
    <text x="400" y="136" fill="#FFEB3B" font-size="11" font-weight="800">ENTRY TRIGGER: ₹342.00</text>
    <text x="400" y="147" fill="#D1D4DC" font-size="9">Candle pierces 15-min high!</text>

    <!-- STOP LOSS BADGE -->
    <rect x="250" y="305" width="170" height="24" rx="4" fill="#131722" stroke="#F23645" stroke-width="1"/>
    <circle cx="320" cy="317" r="4" fill="#F23645"/>
    <text x="260" y="321" fill="#F23645" font-size="10" font-weight="700">STOP LOSS: ₹336.00</text>
    <text x="375" y="321" fill="#787B86" font-size="9">(Below VWAP)</text>

    <!-- CANDLE 3 & 4 (Rally into Target) -->
    <line x1="450" y1="60" x2="450" y2="170" stroke="#089981" stroke-width="2.5"/>
    <rect x="430" y="75" width="40" height="85" fill="#089981" rx="2"/>

    <line x1="530" y1="40" x2="530" y2="130" stroke="#089981" stroke-width="2.5"/>
    <rect x="510" y="50" width="40" height="70" fill="#089981" rx="2"/>

    <!-- TARGET 1 LINE -->
    <line x1="320" y1="60" x2="580" y2="60" stroke="#089981" stroke-width="2" stroke-dasharray="3,3"/>
    <rect x="460" y="35" width="120" height="22" rx="4" fill="#089981"/>
    <text x="470" y="50" fill="#FFFFFF" font-size="10" font-weight="700">TARGET: ₹351 (+1:2)</text>

    <!-- Volume Bars at Bottom -->
    <rect x="125" y="380" width="30" height="70" fill="#089981" opacity="0.6"/>
    <rect x="305" y="360" width="30" height="90" fill="#089981"/>
    <rect x="435" y="375" width="30" height="75" fill="#089981" opacity="0.8"/>
    <rect x="515" y="390" width="30" height="60" fill="#089981" opacity="0.7"/>
    <line x1="80" y1="410" x2="560" y2="410" stroke="#787B86" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="40" y="415" fill="#787B86" font-size="10">20 Vol Avg</text>
    <text x="305" y="352" fill="#089981" font-size="10" font-weight="700">2.5x VOLUME SPIKE</text>
  </g>

  <!-- Right Instructional Panel (310 wide) -->
  <g transform="translate(665, 95)" filter="url(#shadow)">
    <rect width="305" height="555" rx="8" fill="url(#panelGrad)" stroke="#2a2e39" stroke-width="1"/>
    <text x="20" y="35" fill="#2962FF" font-size="16" font-weight="700">HOW TO SETUP VWAP</text>
    <text x="20" y="52" fill="#787B86" font-size="11">TradingView &amp; Zerodha Kite</text>

    <!-- Step 1 -->
    <rect x="15" y="70" width="275" height="75" rx="6" fill="#131722" stroke="#2a2e39" stroke-width="1"/>
    <circle cx="35" cy="95" r="12" fill="#2962FF"/>
    <text x="31" y="100" fill="#FFFFFF" font-size="12" font-weight="700">1</text>
    <text x="55" y="92" fill="#D1D4DC" font-size="12" font-weight="700">Add the Indicator</text>
    <text x="55" y="108" fill="#787B86" font-size="10">• Click "Indicators" (fx) at top</text>
    <text x="55" y="122" fill="#787B86" font-size="10">• Search: "VWAP" or "Volume Weighted"</text>

    <!-- Step 2 -->
    <rect x="15" y="155" width="275" height="85" rx="6" fill="#131722" stroke="#2a2e39" stroke-width="1"/>
    <circle cx="35" cy="180" r="12" fill="#089981"/>
    <text x="31" y="185" fill="#FFFFFF" font-size="12" font-weight="700">2</text>
    <text x="55" y="177" fill="#D1D4DC" font-size="12" font-weight="700">Configure Inputs Tab</text>
    <text x="55" y="193" fill="#787B86" font-size="10">• Anchor Period: "Session" (Default)</text>
    <text x="55" y="207" fill="#787B86" font-size="10">• Source: "hlc3" (High+Low+Close/3)</text>
    <text x="55" y="221" fill="#787B86" font-size="10">• Offset: 0</text>

    <!-- Step 3 -->
    <rect x="15" y="250" width="275" height="95" rx="6" fill="#131722" stroke="#2a2e39" stroke-width="1"/>
    <circle cx="35" cy="275" r="12" fill="#FF9800"/>
    <text x="31" y="280" fill="#FFFFFF" font-size="12" font-weight="700">3</text>
    <text x="55" y="272" fill="#D1D4DC" font-size="12" font-weight="700">Style Tab (Clean Screen)</text>
    <text x="55" y="288" fill="#787B86" font-size="10">• VWAP Line: Make it Thick &amp; Blue</text>
    <text x="55" y="302" fill="#787B86" font-size="10">• Uncheck "Upper Band 1, 2, 3"</text>
    <text x="55" y="316" fill="#787B86" font-size="10">• Uncheck "Lower Band 1, 2, 3"</text>
    <text x="55" y="330" fill="#787B86" font-size="10">• Uncheck "Bands Fill" (Avoid clutter)</text>

    <!-- Step 4 -->
    <rect x="15" y="355" width="275" height="85" rx="6" fill="#131722" stroke="#2a2e39" stroke-width="1"/>
    <circle cx="35" cy="380" r="12" fill="#E91E63"/>
    <text x="31" y="385" fill="#FFFFFF" font-size="12" font-weight="700">4</text>
    <text x="55" y="377" fill="#D1D4DC" font-size="12" font-weight="700">The 5-Min Timeframe</text>
    <text x="55" y="393" fill="#787B86" font-size="10">• Switch chart to 5-Minute (5m)</text>
    <text x="55" y="407" fill="#787B86" font-size="10">• VWAP resets automatically at</text>
    <text x="55" y="421" fill="#089981" font-size="10" font-weight="600">  09:15 AM every single morning</text>

    <!-- Summary Box -->
    <rect x="15" y="450" width="275" height="90" rx="6" fill="#089981" fill-opacity="0.1" stroke="#089981" stroke-width="1"/>
    <text x="25" y="475" fill="#089981" font-size="12" font-weight="700">THE INTRADAY RULE:</text>
    <text x="25" y="495" fill="#D1D4DC" font-size="11">Price ABOVE VWAP = Only BUY</text>
    <text x="25" y="515" fill="#F23645" font-size="11">Price BELOW VWAP = NEVER BUY</text>
  </g>
</svg>