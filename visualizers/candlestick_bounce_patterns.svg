<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="100%" height="100%" style="background-color: #131722; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e222d"/>
      <stop offset="100%" stop-color="#181b24"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Title Banner -->
  <rect x="30" y="20" width="1040" height="60" rx="8" fill="#1e222d" stroke="#2a2e39" stroke-width="1.5"/>
  <text x="50" y="58" fill="#2962FF" font-size="24" font-weight="700">TECHNICAL BOUNCE CONFIRMATION GUIDE</text>
  <text x="580" y="56" fill="#787B86" font-size="14">True Reversals vs. False Traps (Volume &amp; Price Action Confirmation)</text>

  <!-- CARD 1: Bullish Hammer -->
  <g transform="translate(30, 100)" filter="url(#shadow)">
    <rect width="245" height="360" rx="8" fill="url(#cardGrad)" stroke="#2a2e39" stroke-width="1"/>
    <text x="20" y="32" fill="#089981" font-size="16" font-weight="700">1. Bullish Hammer</text>
    <text x="20" y="50" fill="#787B86" font-size="11">Support Level Price Rejection</text>
    
    <!-- Support Line -->
    <line x1="20" y1="250" x2="225" y2="250" stroke="#2962FF" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="140" y="244" fill="#2962FF" font-size="10" font-weight="600">SUPPORT ZONE</text>
    
    <!-- Prior down candle -->
    <line x1="75" y1="120" x2="75" y2="180" stroke="#F23645" stroke-width="2"/>
    <rect x="65" y="130" width="20" height="40" fill="#F23645" rx="1"/>
    
    <!-- Hammer Candle -->
    <!-- Wick -->
    <line x1="150" y1="130" x2="150" y2="270" stroke="#089981" stroke-width="2"/>
    <!-- Small Body -->
    <rect x="140" y="135" width="20" height="20" fill="#089981" rx="1"/>
    
    <!-- Annotations -->
    <!-- Buy Trigger -->
    <line x1="165" y1="130" x2="210" y2="130" stroke="#089981" stroke-width="1"/>
    <text x="170" y="122" fill="#089981" font-size="10" font-weight="700">BUY TRIGGER</text>
    <text x="170" y="142" fill="#D1D4DC" font-size="9">Close above high</text>

    <!-- Long Wick note -->
    <path d="M 160 210 Q 185 210 185 190" fill="none" stroke="#787B86" stroke-width="1"/>
    <text x="188" y="190" fill="#D1D4DC" font-size="9">Long lower wick</text>
    <text x="188" y="202" fill="#787B86" font-size="8">&gt; 2x body height</text>

    <!-- Stop Loss -->
    <line x1="130" y1="275" x2="210" y2="275" stroke="#F23645" stroke-width="1"/>
    <text x="140" y="290" fill="#F23645" font-size="10" font-weight="700">STOP LOSS (SL)</text>
    <text x="140" y="302" fill="#787B86" font-size="9">0.5% below lowest wick</text>

    <!-- Confirmation Rule -->
    <rect x="15" y="315" width="215" height="32" rx="4" fill="#131722"/>
    <text x="25" y="333" fill="#089981" font-size="10" font-weight="600">✔ Buyers rejected lower prices</text>
  </g>

  <!-- CARD 2: Bullish Engulfing -->
  <g transform="translate(295, 100)" filter="url(#shadow)">
    <rect width="245" height="360" rx="8" fill="url(#cardGrad)" stroke="#2a2e39" stroke-width="1"/>
    <text x="20" y="32" fill="#089981" font-size="16" font-weight="700">2. Bullish Engulfing</text>
    <text x="20" y="50" fill="#787B86" font-size="11">Total Institutional Takeover</text>

    <!-- Red Candle (Day 1) -->
    <line x1="75" y1="135" x2="75" y2="215" stroke="#F23645" stroke-width="2"/>
    <rect x="65" y="145" width="20" height="55" fill="#F23645" rx="1"/>
    <text x="50" y="235" fill="#787B86" font-size="10">Day 1: Red</text>

    <!-- Green Engulfing (Day 2) -->
    <line x1="145" y1="120" x2="145" y2="230" stroke="#089981" stroke-width="2"/>
    <rect x="132" y="130" width="26" height="85" fill="#089981" rx="1"/>
    <text x="125" y="245" fill="#089981" font-size="10" font-weight="600">Day 2: Engulf</text>

    <!-- Bracket showing coverage -->
    <path d="M 165 130 L 175 130 L 175 215 L 165 215" fill="none" stroke="#2962FF" stroke-width="1.5"/>
    <text x="180" y="175" fill="#2962FF" font-size="10" font-weight="600">100% Covers</text>
    <text x="180" y="188" fill="#787B86" font-size="9">Prior Red Body</text>

    <!-- Volume Bars -->
    <rect x="65" y="265" width="20" height="25" fill="#F23645" opacity="0.6"/>
    <rect x="135" y="250" width="20" height="40" fill="#089981"/>
    <line x1="50" y1="260" x2="180" y2="260" stroke="#787B86" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="50" y="303" fill="#787B86" font-size="9">Low Vol</text>
    <text x="125" y="303" fill="#089981" font-size="9" font-weight="700">&gt; 2x Vol Spike</text>

    <!-- Confirmation Rule -->
    <rect x="15" y="315" width="215" height="32" rx="4" fill="#131722"/>
    <text x="25" y="333" fill="#089981" font-size="10" font-weight="600">✔ Huge volume confirms smart money</text>
  </g>

  <!-- CARD 3: Morning Star -->
  <g transform="translate(560, 100)" filter="url(#shadow)">
    <rect width="245" height="360" rx="8" fill="url(#cardGrad)" stroke="#2a2e39" stroke-width="1"/>
    <text x="20" y="32" fill="#089981" font-size="16" font-weight="700">3. Morning Star</text>
    <text x="20" y="50" fill="#787B86" font-size="11">3-Day Major Trend Reversal</text>

    <!-- Candle 1: Big Bearish -->
    <line x1="60" y1="120" x2="60" y2="200" stroke="#F23645" stroke-width="2"/>
    <rect x="50" y="130" width="20" height="60" fill="#F23645" rx="1"/>

    <!-- Candle 2: Indecision Star -->
    <line x1="110" y1="195" x2="110" y2="235" stroke="#D1D4DC" stroke-width="2"/>
    <rect x="103" y="205" width="14" height="15" fill="#F23645" rx="1"/>

    <!-- Candle 3: Strong Bullish (>50% penetration) -->
    <line x1="160" y1="130" x2="160" y2="215" stroke="#089981" stroke-width="2"/>
    <rect x="150" y="140" width="20" height="65" fill="#089981" rx="1"/>

    <!-- 50% Line -->
    <line x1="45" y1="160" x2="180" y2="160" stroke="#FF9800" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="182" y="163" fill="#FF9800" font-size="9">50% Line</text>

    <!-- Buy Trigger Line -->
    <line x1="150" y1="125" x2="225" y2="125" stroke="#089981" stroke-width="1.5"/>
    <text x="155" y="118" fill="#089981" font-size="10" font-weight="700">ENTRY TRIGGER</text>

    <!-- Labels -->
    <text x="45" y="255" fill="#F23645" font-size="9">Day 1: Drop</text>
    <text x="95" y="255" fill="#787B86" font-size="9">Day 2: Star</text>
    <text x="145" y="255" fill="#089981" font-size="9">Day 3: Surge</text>

    <!-- Confirmation Rule -->
    <rect x="15" y="315" width="215" height="32" rx="4" fill="#131722"/>
    <text x="25" y="333" fill="#089981" font-size="10" font-weight="600">✔ Closes deep into Day 1 body</text>
  </g>

  <!-- CARD 4: False Trap vs True Bounce -->
  <g transform="translate(825, 100)" filter="url(#shadow)">
    <rect width="245" height="360" rx="8" fill="url(#cardGrad)" stroke="#2a2e39" stroke-width="1"/>
    <text x="20" y="32" fill="#F23645" font-size="16" font-weight="700">4. False vs True Bounce</text>
    <text x="20" y="50" fill="#787B86" font-size="11">How to Spot Dead-Cat Traps</text>

    <!-- False Bounce Box -->
    <rect x="15" y="70" width="105" height="235" rx="6" fill="#1e181c" stroke="#F23645" stroke-width="1"/>
    <text x="25" y="90" fill="#F23645" font-size="11" font-weight="700">FALSE BOUNCE</text>
    <text x="25" y="103" fill="#787B86" font-size="9">(Dead-Cat Trap)</text>
    
    <!-- 20 EMA line sloping down -->
    <path d="M 20 120 Q 70 140 115 170" fill="none" stroke="#FF5252" stroke-width="2"/>
    <text x="75" y="135" fill="#FF5252" font-size="8">20 EMA</text>

    <!-- Weak candle rejected by EMA -->
    <line x1="65" y1="130" x2="65" y2="185" stroke="#089981" stroke-width="1.5"/>
    <rect x="58" y="150" width="14" height="25" fill="#089981"/>
    <text x="22" y="210" fill="#F23645" font-size="9">• Long Upper Wick</text>
    <text x="22" y="224" fill="#F23645" font-size="9">• Rejected at 20 EMA</text>
    <text x="22" y="238" fill="#F23645" font-size="9">• Tiny Volume</text>
    <text x="22" y="252" fill="#F23645" font-size="9">• Next day dumps</text>

    <!-- True Bounce Box -->
    <rect x="125" y="70" width="105" height="235" rx="6" fill="#14211d" stroke="#089981" stroke-width="1"/>
    <text x="135" y="90" fill="#089981" font-size="11" font-weight="700">TRUE BOUNCE</text>
    <text x="135" y="103" fill="#787B86" font-size="9">(Follow-Through)</text>

    <!-- Strong candle breaking out -->
    <line x1="175" y1="120" x2="175" y2="190" stroke="#089981" stroke-width="2"/>
    <rect x="165" y="130" width="20" height="50" fill="#089981"/>
    <text x="132" y="210" fill="#089981" font-size="9">• Full Body Close</text>
    <text x="132" y="224" fill="#089981" font-size="9">• Slices above 20 EMA</text>
    <text x="132" y="238" fill="#089981" font-size="9">• 2x Volume Surge</text>
    <text x="132" y="252" fill="#089981" font-size="9">• Higher Low intact</text>

    <!-- Confirmation Rule -->
    <rect x="15" y="315" width="215" height="32" rx="4" fill="#131722"/>
    <text x="25" y="333" fill="#F23645" font-size="10" font-weight="600">✖ Never buy without follow-through</text>
  </g>

  <!-- LOWER PANEL: 3-RULE CONFIRMATION CHEAT SHEET -->
  <g transform="translate(30, 480)" filter="url(#shadow)">
    <rect width="1040" height="195" rx="8" fill="url(#cardGrad)" stroke="#2a2e39" stroke-width="1"/>
    <text x="30" y="35" fill="#2962FF" font-size="18" font-weight="700">THE 3-STEP BOUNCE CONFIRMATION CHECKLIST</text>
    <text x="30" y="55" fill="#787B86" font-size="12">Never enter on a single candle alone. Wait for these 3 conditions to align before risking real capital:</text>

    <!-- Rule 1 -->
    <rect x="30" y="75" width="310" height="95" rx="6" fill="#131722" stroke="#2a2e39" stroke-width="1"/>
    <circle cx="55" cy="100" r="14" fill="#2962FF"/>
    <text x="50" y="105" fill="#FFFFFF" font-size="14" font-weight="700">1</text>
    <text x="80" y="98" fill="#D1D4DC" font-size="13" font-weight="700">Support Floor Respect</text>
    <text x="80" y="120" fill="#787B86" font-size="11">Price touches prior swing low,</text>
    <text x="80" y="135" fill="#787B86" font-size="11">200 EMA, or horizontal demand line</text>
    <text x="80" y="150" fill="#089981" font-size="11" font-weight="600">and leaves a lower wick.</text>

    <!-- Rule 2 -->
    <rect x="365" y="75" width="310" height="95" rx="6" fill="#131722" stroke="#2a2e39" stroke-width="1"/>
    <circle cx="390" cy="100" r="14" fill="#089981"/>
    <text x="385" y="105" fill="#FFFFFF" font-size="14" font-weight="700">2</text>
    <text x="415" y="98" fill="#D1D4DC" font-size="13" font-weight="700">Institutional Volume</text>
    <text x="415" y="120" fill="#787B86" font-size="11">Reversal candle volume must exceed</text>
    <text x="415" y="135" fill="#787B86" font-size="11">the 20-day average volume (RVOL ≥ 1.5).</text>
    <text x="415" y="150" fill="#089981" font-size="11" font-weight="600">Confirms institutional accumulation.</text>

    <!-- Rule 3 -->
    <rect x="700" y="75" width="345" height="95" rx="6" fill="#131722" stroke="#2a2e39" stroke-width="1"/>
    <circle cx="725" cy="100" r="14" fill="#FF9800"/>
    <text x="720" y="105" fill="#FFFFFF" font-size="14" font-weight="700">3</text>
    <text x="750" y="98" fill="#D1D4DC" font-size="13" font-weight="700">Trigger Break &amp; Follow-Through</text>
    <text x="750" y="120" fill="#787B86" font-size="11">Enter ONLY when the subsequent candle</text>
    <text x="750" y="135" fill="#787B86" font-size="11">breaks above the reversal candle's high.</text>
    <text x="750" y="150" fill="#089981" font-size="11" font-weight="600">SL placed 0.5% below lowest swing point.</text>
  </g>
</svg>